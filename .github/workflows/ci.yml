name: MQTT IO CI
on:
  push:
  pull_request:
  release:
    types: [published]
jobs:
  test:
    runs-on: ubuntu-22.04
    strategy:
      matrix:
        python-version: ['3.10', '3.12']

    steps:
      - uses: actions/checkout@v4
      - name: Setup Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: Install dependencies
        run: |
          pip install poetry
          poetry install
      - name: Lint with pylint
        run: poetry run pylint -d fixme mqtt_io
      - name: Lint with mypy
        run: poetry run mypy --show-error-codes --strict --no-warn-unused-ignores mqtt_io
      - name: Test with behave
        run: poetry run behave --tags ~fixme mqtt_io/tests/features
      - name: Test stream reconnect
        run: poetry run pytest mqtt_io/tests/test_stream_reconnect.py
      - name: Test USB stream cleanup
        run: poetry run pytest mqtt_io/tests/test_stream_usb.py
      - name: Test release validation
        run: poetry run python -m unittest discover -s scripts/tests -v

  release_metadata:
    name: Validate release metadata
    if: github.event_name == 'release' && github.event.action == 'published'
    runs-on: ubuntu-22.04
    outputs:
      version: ${{ steps.release.outputs.version }}
      stable: ${{ steps.release.outputs.stable }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: pip install 'packaging>=23.2'
      - name: Validate tag, package version and release type
        id: release
        run: python scripts/validate_release.py

  publish:
    name: Publish to PyPI
    if: github.event_name == 'release' && github.event.action == 'published'
    runs-on: ubuntu-22.04
    needs: [test, release_metadata]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install poetry
        run: pip install poetry
      - name: Build packages
        run: poetry build
      - name: Publish packages
        uses: pypa/gh-action-pypi-publish@release/v1
        with:
          password: ${{ secrets.PYPI_API_TOKEN }}

  build_docker_image:
    name: Build Docker Image
    if: >-
      always() && needs.test.result == 'success' &&
      ((github.event_name == 'release' && github.event.action == 'published' && needs.release_metadata.result == 'success') ||
       (github.event_name == 'push' && github.ref_type == 'branch' && github.ref_name != 'gh-pages'))
    runs-on: ubuntu-22.04
    needs: [test, release_metadata]
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-qemu-action@v3
      - id: buildx
        uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKER_HUB_USERNAME }}
          password: ${{ secrets.DOCKER_HUB_TOKEN }}
      - name: Publish release image
        if: github.event_name == 'release'
        env:
          VERSION: ${{ needs.release_metadata.outputs.version }}
          STABLE: ${{ needs.release_metadata.outputs.stable }}
        run: |
          tags=(-t "flyte/mqtt-io:${VERSION}")
          if [[ "$STABLE" == 'true' ]]; then
            tags+=(-t flyte/mqtt-io:latest)
          fi
          docker buildx build --platform linux/arm/v7,linux/arm64/v8,linux/amd64 "${tags[@]}" --push .
      - name: Publish branch image
        if: github.event_name == 'push'
        env:
          BRANCH_NAME: ${{ github.ref_name }}
        run: |
          TAG_NAME="branch-$(printf '%s' "$BRANCH_NAME" | LC_ALL=C sed 's/[^A-Za-z0-9_.-]/-/g' | cut -c1-120)"
          docker buildx build --platform linux/arm/v7,linux/arm64/v8,linux/amd64 -t "flyte/mqtt-io:${TAG_NAME}" --push .

  generate_docs:
    name: Generate Documentation
    if: github.event_name == 'push' && github.ref_name != 'gh-pages'
    concurrency: generate_docs
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Get branch names
        id: branch-names
        uses: tj-actions/branch-names@v8
      - name: Ensure we can checkout gh-pages for release (${{ steps.branch-names.outputs.tag }})
        if: steps.branch-names.outputs.is_tag == 'true'
        run: |
          git checkout gh-pages
          git checkout ${{ steps.branch-names.outputs.tag }}
      - name: Ensure we can checkout gh-pages for pr (${{ steps.branch-names.outputs.current_branch }})
        if: steps.branch-names.outputs.is_tag == 'false'
        run: |
          git checkout gh-pages
          git checkout ${{ steps.branch-names.outputs.current_branch }}
      - name: Setup Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install dependencies and generate docs
        run: |
          pip install poetry
          ls
          git status
          poetry install
          poetry run python docs_src/generate_docs.py

